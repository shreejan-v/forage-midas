general:
  kafka-topic: trader-updates
  # Forage incentive service; override with GENERAL_INCENTIVE_API_URL
  incentive-api-url: http://localhost:8080/incentive

server:
  port: 33400

spring:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: midas-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction
        spring.json.trusted.packages: com.jpmc.midascore.foundation
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: jdbc:h2:mem:midas;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
